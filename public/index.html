<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>The Print Shoppe - Attendance</title>
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary": "#b80049",
            "primary-container": "#e2165f",
            "secondary": "#006493",
            "secondary-container": "#24b2fe",
            "tertiary": "#186a22",
            "background": "#f8f9fb",
            "surface": "#ffffff",
            "on-surface": "#191c1e",
            "on-surface-variant": "#5b3f43",
            "outline-variant": "#e4bdc2"
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; }
    .pulse-halo {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1.1); opacity: 0.1; }
      50% { transform: scale(1.25); opacity: 0.2; }
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
  <!-- TopAppBar -->
  <header class="w-full bg-white shadow-sm z-10 sticky top-0 overflow-hidden">
    <img alt="The Print Shoppe Logo" class="w-full h-auto object-contain max-h-24" src="https://lh3.googleusercontent.com/aida/ADBb0uiL3ebYbYf4iB51Br7nev604RUSxIImIOb9kIdVoxl-g4c1kZTgW7-zfRPQhzPilLdh6rBEvlMSJdKSWWuAUMPg_GE1b7RV69oslhCvS2CuwDEH3UE12awqT1wNKmvHIkhz-NcflLcFrgZZ4ODoDJmK6DU7nSKBNzeAbcqIx7DhpxZzlN3cyLJ5Y0eKFtJ40VR0PWYoZnshmRIDDd_M5ScL8yC19L7fem_empWLPudPGXv29tVYp6_JYJI-vcvSNZ6Z5qhySmZ_jg"/>
  </header>

  <main class="flex-grow flex flex-col px-4 py-8 max-w-md mx-auto w-full mb-20">
    <!-- Welcome -->
    <section class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-primary mb-1">Welcome to The Print Shoppe</h1>
      <p class="text-sm text-on-surface-variant">Ready for your shift? Track your hours with a tap.</p>
    </section>

    <!-- Quick Actions -->
    <div class="grid grid-cols-2 gap-4 mb-8">
      <a href="register.html" class="flex flex-col items-center justify-center py-6 bg-white border border-outline-variant rounded-2xl hover:bg-gray-50 transition-all active:scale-95">
        <span class="material-symbols-outlined text-secondary text-[32px] mb-2">person_add</span>
        <span class="text-sm font-semibold text-secondary">Register</span>
      </a>
      <a href="admin.html" class="flex flex-col items-center justify-center py-6 bg-white border border-outline-variant rounded-2xl hover:bg-gray-50 transition-all active:scale-95">
        <span class="material-symbols-outlined text-secondary text-[32px] mb-2">admin_panel_settings</span>
        <span class="text-sm font-semibold text-secondary">Admin</span>
      </a>
    </div>

    <!-- Central Action -->
    <section class="flex-grow flex flex-col items-center justify-center py-10">
      <div class="relative group">
        <div class="absolute inset-0 bg-primary opacity-10 rounded-full blur-xl pulse-halo"></div>
        <button onclick="window.location.href='attendance.html'" class="relative w-64 h-64 bg-primary text-white rounded-full shadow-2xl flex flex-col items-center justify-center transition-all duration-150 active:scale-90 hover:brightness-110 focus:outline-none">
          <span class="material-symbols-outlined text-[80px] mb-1" style="font-variation-settings: 'FILL' 1;">touch_app</span>
          <span class="text-lg uppercase tracking-widest font-medium">Mark</span>
          <span class="text-2xl font-black uppercase">Attendance</span>
        </button>
      </div>
      <p class="mt-8 text-xs text-on-surface-variant flex items-center gap-1">
        <span class="material-symbols-outlined text-sm">location_on</span>
        Office: Nallakunta, Hyderabad
      </p>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-white border-t border-gray-200 shadow-lg rounded-t-2xl">
    <a class="flex flex-col items-center justify-center bg-primary-container text-white rounded-full px-6 py-1 transition-all" href="/">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-gray-100 rounded-full px-6 py-1" href="attendance.html">
      <span class="material-symbols-outlined">history</span>
      <span class="text-[10px] font-bold">Log</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-gray-100 rounded-full px-6 py-1" href="admin.html">
      <span class="material-symbols-outlined">admin_panel_settings</span>
      <span class="text-[10px] font-bold">Admin</span>
    </a>
  </nav>

</body>
</html>
