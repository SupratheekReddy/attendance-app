<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance - The Print Shoppe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#b80049",
            "primary-container": "#e2165f",
            "secondary": "#006493",
            "background": "#f8f9fb"
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .face-frame {
      border: 2px solid rgba(184, 0, 73, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-background text-gray-900 min-h-screen flex flex-col font-['Inter']">
  <header class="flex justify-between items-center px-4 h-16 w-full bg-white shadow-sm sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-3">
        <img alt="Logo" class="h-10" src="https://lh3.googleusercontent.com/aida/ADBb0uiL3ebYbYf4iB51Br7nev604RUSxIImIOb9kIdVoxl-g4c1kZTgW7-zfRPQhzPilLdh6rBEvlMSJdKSWWuAUMPg_GE1b7RV69oslhCvS2CuwDEH3UE12awqT1wNKmvHIkhz-NcflLcFrgZZ4ODoDJmK6DU7nSKBNzeAbcqIx7DhpxZzlN3cyLJ5Y0eKFtJ40VR0PWYoZnshmRIDDd_M5ScL8yC19L7fem_empWLPudPGXv29tVYp6_JYJI-vcvSNZ6Z5qhySmZ_jg"/>
        <span class="text-xl font-extrabold text-primary">The Print Shoppe</span>
      </a>
    </div>
  </header>

  <main class="flex-grow px-4 py-8 max-w-md mx-auto w-full mb-20">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-black text-gray-900 mb-2">Check In/Out</h1>
      <p class="text-gray-500">Verify your identity to record your shift.</p>
    </div>

    <!-- Step 1: ID Input -->
    <div id="idInputSection" class="bg-white rounded-3xl p-8 shadow-xl border border-gray-100">
      <div class="mb-6">
        <label class="block text-sm font-bold text-gray-700 mb-2" for="userIdInput">Employee ID</label>
        <input type="text" id="userIdInput" class="w-full px-5 py-4 bg-gray-50 border-gray-200 rounded-2xl focus:ring-primary focus:border-primary text-lg font-bold uppercase tracking-widest" placeholder="e.g. T1">
      </div>
      <button id="startAuthBtn" class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition-all">Verify My Identity</button>
    </div>

    <!-- Step 2: Camera Section -->
    <div id="authSection" class="hidden space-y-6">
      <div class="bg-white rounded-3xl overflow-hidden shadow-2xl border-4 border-white">
        <div class="relative aspect-[3/4] bg-black">
          <video id="video" class="w-full h-full object-cover" autoplay muted playsinline></video>
          <div class="absolute inset-0 flex items-center justify-center p-8 pointer-events-none">
            <div class="w-full aspect-square face-frame"></div>
          </div>
          <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse" id="cameraDot"></span>
            <span class="text-white text-xs font-bold" id="cameraLabel">Scanning...</span>
          </div>
        </div>
        <div class="p-6">
          <button id="markBtn" class="w-full py-5 bg-primary text-white text-xl font-black rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3">
            <span class="material-symbols-outlined text-2xl">check_circle</span>
            MARK ATTENDANCE
          </button>
        </div>
      </div>

    </div>

    <!-- Feedback Status Bar -->
    <div id="statusBar" class="status-bar">
      <span id="statusIcon" class="material-symbols-outlined">info</span>
      <span id="statusMsg" class="text-sm font-semibold"></span>
    </div>

    <!-- Step 3: Result Card -->
    <div id="resultCard" class="hidden bg-white rounded-3xl p-10 shadow-2xl border border-gray-100 text-center animate-[bounce_0.5s_ease-out]">
      <div id="resultIcon" class="text-6xl mb-4"></div>
      <h2 id="resultTitle" class="text-2xl font-black text-gray-900 mb-2"></h2>
      <div id="resultTime" class="text-4xl font-black text-primary mb-2"></div>
      <p id="resultDetail" class="text-gray-500 mb-8"></p>
      <button onclick="window.location.href='/'" class="w-full py-4 bg-secondary text-white font-bold rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition-all">🏠 Back to Home</button>
    </div>
  </main>

  <nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-3 bg-white border-t border-gray-200 shadow-lg rounded-t-2xl md:hidden">
    <a class="flex flex-col items-center justify-center text-gray-400 hover:bg-gray-100 rounded-full px-6 py-1" href="/">
      <span class="material-symbols-outlined">home</span>
      <span class="text-[10px] font-bold">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center bg-primary-container text-white rounded-full px-6 py-1 transition-all" href="attendance.html">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">history</span>
      <span class="text-[10px] font-bold">Log</span>
    </a>
    <a class="flex flex-col items-center justify-center text-gray-400 hover:bg-gray-100 rounded-full px-6 py-1" href="admin.html">
      <span class="material-symbols-outlined">admin_panel_settings</span>
      <span class="text-[10px] font-bold">Admin</span>
    </a>
  </nav>

  <!-- Loading overlay -->
  <div class="hidden fixed inset-0 z-[100] bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center" id="loadingOverlay">
    <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
    <div class="mt-4 text-primary font-black uppercase tracking-widest text-sm" id="loadingText">Processing...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/faceSetup.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
