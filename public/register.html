<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - The Print Shoppe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#b80049",
            "secondary": "#006493",
            "background": "#f8f9fb"
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-background text-gray-900 min-h-screen flex flex-col font-['Inter']">
  <header class="flex justify-between items-center px-4 h-16 w-full bg-white shadow-sm sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-3">
        <img alt="Logo" class="h-10" src="https://lh3.googleusercontent.com/aida/ADBb0uiL3ebYbYf4iB51Br7nev604RUSxIImIOb9kIdVoxl-g4c1kZTgW7-zfRPQhzPilLdh6rBEvlMSJdKSWWuAUMPg_GE1b7RV69oslhCvS2CuwDEH3UE12awqT1wNKmvHIkhz-NcflLcFrgZZ4ODoDJmK6DU7nSKBNzeAbcqIx7DhpxZzlN3cyLJ5Y0eKFtJ40VR0PWYoZnshmRIDDd_M5ScL8yC19L7fem_empWLPudPGXv29tVYp6_JYJI-vcvSNZ6Z5qhySmZ_jg"/>
        <span class="text-xl font-extrabold text-primary">The Print Shoppe</span>
      </a>
    </div>
  </header>

  <main class="flex-grow px-4 py-8 max-w-md mx-auto w-full mb-20">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-black text-gray-900 mb-2">New Employee</h1>
      <p class="text-gray-500">Register your face to start tracking your hours.</p>
    </div>

    <!-- Step 1: Details -->
    <div id="detailsSection" class="bg-white rounded-3xl p-8 shadow-xl border border-gray-100">
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2" for="userName">Full Name</label>
          <input type="text" id="userName" class="w-full px-5 py-4 bg-gray-50 border-gray-200 rounded-2xl focus:ring-primary focus:border-primary" placeholder="e.g. Rahul Nair">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2" for="userId">Employee ID</label>
          <input type="text" id="userId" class="w-full px-5 py-4 bg-gray-50 border-gray-200 rounded-2xl focus:ring-primary focus:border-primary font-bold uppercase tracking-widest" placeholder="e.g. EMP101">
        </div>
        <button id="startCamBtn" class="w-full py-4 bg-primary text-white font-bold rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition-all">📸 Proceed to Face Scan</button>
      </div>
    </div>

    <!-- Step 2: Camera Section -->
    <div id="cameraSection" class="hidden space-y-6">
      <div class="bg-white rounded-3xl overflow-hidden shadow-2xl border-4 border-white">
        <div class="relative aspect-video bg-black">
          <video id="video" class="w-full h-full object-cover" autoplay muted playsinline></video>
          <div class="absolute bottom-4 left-4 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse" id="cameraDot"></span>
            <span class="text-white text-xs font-bold" id="cameraLabel">Scanning...</span>
          </div>
        </div>
        <div class="p-6">
          <button id="registerBtn" class="w-full py-5 bg-primary text-white text-xl font-black rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-3">
            <span class="material-symbols-outlined text-2xl">face</span>
            CAPTURE & REGISTER
          </button>
        </div>
      </div>
    </div>

    <!-- Feedback Status Bar -->
    <div id="statusBar" class="status-bar">
      <span id="statusIcon" class="material-symbols-outlined">info</span>
      <span id="statusMsg" class="text-sm font-semibold"></span>
    </div>
  </main>

  <!-- Loading overlay -->
  <div class="hidden fixed inset-0 z-[100] bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center" id="loadingOverlay">
    <div class="w-16 h-16 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
    <div class="mt-4 text-primary font-black uppercase tracking-widest text-sm" id="loadingText">Processing...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/faceSetup.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
